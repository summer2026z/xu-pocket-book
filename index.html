<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff8f5">
<title>宣的專款帳本</title>
<style>
:root{--bg:#fff8f5;--card:#fff;--ink:#493b38;--muted:#998b87;--pink:#ee8fa4;--pink2:#fde5e9;--green:#e6f4df;--blue:#e5f0fb;--purple:#eee6fa;--line:#eee3df}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 16px}
h1{font-size:25px;margin:0}.gear{font-size:22px}.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 5px 18px #6d4b3d0d;margin-bottom:13px}
.hero{background:linear-gradient(135deg,#fff,#fde9e6)}.label{font-size:13px;color:var(--muted)}.balance{font-size:36px;font-weight:800;margin:5px 0}.ok{color:#4c9a62;font-weight:700}.bad{color:#d76868;font-weight:700}
.wallet{display:flex;align-items:center;gap:12px;padding:15px;border-radius:18px;margin:9px 0}.wallet .icon{font-size:27px}.wallet .name{font-weight:700}.wallet .amt{margin-left:auto;font-size:19px;font-weight:800}.w1{background:var(--pink2)}.w2{background:var(--green)}.w3{background:var(--blue)}.w4{background:var(--purple)}
button{border:0;border-radius:17px;padding:14px 16px;font-size:16px;font-weight:750}.primary{width:100%;background:var(--pink);color:white;font-size:18px}.secondary{background:#f4eeeb;color:var(--ink)}.danger{background:#fff0f0;color:#c95c5c}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fffefdf2;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.navin{width:min(520px,100%);display:flex}.nav button{flex:1;background:transparent;color:#9b8f8a;border-radius:0;padding:12px 3px}.nav button.active{color:#e46f8b}
.page{display:none}.page.active{display:block}.sectionTitle{font-weight:800;margin:18px 4px 8px}.row{display:flex;align-items:center;gap:10px;border-bottom:1px solid #f1e8e5;padding:12px 0}.row:last-child{border-bottom:0}.grow{flex:1}.money.neg{color:#e35e74}.money.pos{color:#4c9a62}
input,select,textarea{width:100%;padding:13px;border:1px solid #e5d9d5;border-radius:13px;background:white;font-size:16px;color:var(--ink);margin:6px 0 13px}label{font-size:14px;font-weight:700}
.tabs{display:flex;gap:7px;margin-bottom:14px}.tabs button{flex:1;padding:10px;background:#f2ece9}.tabs button.on{background:var(--pink);color:white}
.item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #f2e9e5}.pill{font-size:12px;background:#f3edeb;padding:5px 8px;border-radius:99px}.small{font-size:12px;color:var(--muted)}
.modal{display:none;position:fixed;inset:0;background:#4b35352b;z-index:5;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{background:var(--bg);width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 16px calc(22px + env(safe-area-inset-bottom))}
.close{float:right;background:#f1e9e6;padding:8px 11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.note{background:#fff2cf;border-radius:15px;padding:12px;font-size:13px;margin:10px 0}.empty{text-align:center;color:var(--muted);padding:28px}
</style>
</head>
<body>
<div class="app">
  <div class="top"><h1>宣的專款帳本 ♡</h1><span class="gear">⚙️</span></div>

  <section id="home" class="page active">
    <div class="hero">
      <div class="label">🏦 台新帳戶｜專款管理</div>
      <div class="balance" id="total">$102,650</div>
      <div class="small">分類加總 <span id="sumWallets">$102,650</span>　<span id="match" class="ok">帳目相符 ✓</span></div>
    </div>
    <div class="sectionTitle">資金分配（虛擬錢包）</div>
    <div id="wallets"></div>
    <button class="primary" onclick="openEntry()">＋ 記一筆</button>
    <div class="note">💡 銀行只有一個餘額；這裡幫你把同一個帳戶裡「不能混用的錢」分開管理。</div>
  </section>

  <section id="records" class="page">
    <div class="sectionTitle">記帳紀錄</div>
    <div class="card" id="recordList"></div>
  </section>

  <section id="reserve" class="page">
    <div class="hero"><div class="label">🧺 家庭固存</div><div class="balance" id="reserveBalance">$12,018</div><div class="small">只有下列指定項目預設可從固存扣款</div></div>
    <div class="sectionTitle">固定預備項目</div>
    <div class="card" id="reserveItems"></div>
  </section>

  <section id="settings" class="page">
    <div class="sectionTitle">帳本設定</div>
    <div class="card">
      <label>銀行實際餘額（用來核帳）</label>
      <input id="bankActual" type="number" inputmode="decimal">
      <button class="primary" onclick="saveActual()">更新實際餘額</button>
    </div>
    <div class="card">
      <b>備份與還原</b><p class="small">資料目前只存在這台裝置的瀏覽器。建議定期備份。</p>
      <div class="grid2"><button class="secondary" onclick="backup()">匯出備份</button><button class="secondary" onclick="document.getElementById('restoreFile').click()">匯入備份</button></div>
      <input id="restoreFile" type="file" accept=".json" style="display:none" onchange="restore(event)">
    </div>
    <button class="danger" onclick="resetAll()">重設測試資料</button>
  </section>
</div>

<div class="nav"><div class="navin">
<button class="active" onclick="showPage('home',this)">⌂<br>首頁</button>
<button onclick="showPage('records',this)">▤<br>紀錄</button>
<button onclick="showPage('reserve',this)">🧺<br>固存</button>
<button onclick="showPage('settings',this)">•••<br>更多</button>
</div></div>

<div id="entryModal" class="modal"><div class="sheet">
  <button class="close" onclick="closeEntry()">✕</button><h2>記一筆</h2>
  <div class="tabs">
    <button id="tExpense" class="on" onclick="setType('expense')">支出</button>
    <button id="tIncome" onclick="setType('income')">收入</button>
    <button id="tTransfer" onclick="setType('transfer')">轉移</button>
  </div>
  <label>金額</label><input id="amount" type="number" inputmode="decimal" placeholder="例如 1099">
  <label>日期</label><input id="date" type="date">
  <div id="normalFields">
    <label>錢包</label><select id="wallet"></select>
    <div id="reserveField">
      <label>固存項目</label><select id="reserveItem"></select>
    </div>
    <label>項目／備註</label><input id="memo" placeholder="例如：尿布 2 包＋濕紙巾">
  </div>
  <div id="transferFields" style="display:none">
    <label>從</label><select id="fromWallet"></select>
    <label>轉到</label><select id="toWallet"></select>
  </div>
  <button class="primary" onclick="saveEntry()">儲存</button>
</div></div>

<script>
const KEY='xuanPocketBookV1';
const reserveSeed=[
['洗髮精','日用品',200,2,100],['沐浴乳','日用品',300,3,100],['擦臉巾','日用品',129,1,129],
['洗手乳','日用品',200,5,40],['洗面乳','日用品',250,1,250],['衛生紙','日用品',1050,3,350],
['私密清潔乳','日用品',240,3,80],['奶瓶清洗液','寶寶用品',350,5,70],['寶寶身體乳液','寶寶用品',660,12,55],
['寶寶口腔噴霧','寶寶用品',240,4,60],['寶寶洗沐二合一','寶寶用品',200,5,40],['寶寶擦臉乳液','寶寶用品',300,12,25],
['濕紙巾','寶寶用品',1000,5,200],['奶粉','寶寶用品',18600,4,4650],['尿布','寶寶用品',1800,1,1800],
['乳鐵蛋白','寶寶用品',3600,8,450],['夜用尿布','寶寶用品',375,1,375],['保健食品','食品大人',4440,6,740],
['停車費','其他',3000,3,1000]
];
const seed={
 bankActual:102650,
 wallets:[
  {id:'nini',name:'阿霓專款',icon:'👧',balance:50647,cls:'w1'},
  {id:'reserve',name:'家庭固存',icon:'🧺',balance:12018,cls:'w2'},
  {id:'bike',name:'機車預存',icon:'🛵',balance:38985,cls:'w3'},
  {id:'temp',name:'暫存手機費',icon:'📱',balance:1000,cls:'w4'}
 ],
 reserveItems:reserveSeed.map(x=>({name:x[0],category:x[1],price:x[2],cycle:x[3],monthly:x[4]})),
 records:[]
};
let data=load(),entryType='expense';
function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(seed)}catch(e){return clone(seed)}}
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render()}
const money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW');
const w=id=>data.wallets.find(x=>x.id===id);
function render(){
 const sum=data.wallets.reduce((a,b)=>a+Number(b.balance),0);
 document.getElementById('total').textContent=money(data.bankActual);
 document.getElementById('sumWallets').textContent=money(sum);
 const diff=Number(data.bankActual)-sum,m=document.getElementById('match');
 m.className=diff===0?'ok':'bad';m.textContent=diff===0?'帳目相符 ✓':'差額 '+(diff>0?'+':'')+money(diff).replace('$','');
 document.getElementById('wallets').innerHTML=data.wallets.map(x=>`<div class="wallet ${x.cls}"><div class="icon">${x.icon}</div><div><div class="name">${x.name}</div><div class="small">${sum?((x.balance/sum)*100).toFixed(1):0}%</div></div><div class="amt">${money(x.balance)}</div></div>`).join('');
 document.getElementById('reserveBalance').textContent=money(w('reserve').balance);
 document.getElementById('reserveItems').innerHTML=data.reserveItems.map(x=>`<div class="item"><div class="grow"><b>${x.name}</b> <span class="pill">${x.category}</span><div class="small">單次約 ${money(x.price)}｜${x.cycle} 個月｜每月應存 ${money(x.monthly)}</div></div></div>`).join('');
 document.getElementById('recordList').innerHTML=data.records.length?data.records.slice().reverse().map(r=>{
   if(r.type==='transfer') return `<div class="row"><div class="grow"><b>↔️ ${r.memo}</b><div class="small">${r.date}</div></div><b>${money(r.amount)}</b></div>`;
   return `<div class="row"><div class="grow"><b>${r.type==='expense'?'🧾':'💰'} ${r.memo||'未命名'}</b><div class="small">${r.date}｜${w(r.wallet)?.name||''}${r.reserveItem?' → '+r.reserveItem:''}</div></div><b class="money ${r.type==='expense'?'neg':'pos'}">${r.type==='expense'?'-':'+'}${money(r.amount)}</b></div>`
 }).join(''):'<div class="empty">還沒有紀錄 🌷</div>';
 document.getElementById('bankActual').value=data.bankActual;
 fillSelects();
}
function fillSelects(){
 const opts=data.wallets.map(x=>`<option value="${x.id}">${x.icon} ${x.name}｜${money(x.balance)}</option>`).join('');
 ['wallet','fromWallet','toWallet'].forEach(id=>document.getElementById(id).innerHTML=opts);
 document.getElementById('reserveItem').innerHTML='<option value="">請選擇</option>'+data.reserveItems.map(x=>`<option>${x.name}</option>`).join('');
 document.getElementById('wallet').onchange=toggleReserve;
 toggleReserve();
}
function toggleReserve(){document.getElementById('reserveField').style.display=document.getElementById('wallet').value==='reserve'?'block':'none'}
function showPage(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function openEntry(){document.getElementById('entryModal').classList.add('on');document.getElementById('date').value=new Date().toISOString().slice(0,10);setType('expense')}
function closeEntry(){document.getElementById('entryModal').classList.remove('on')}
function setType(t){entryType=t;['Expense','Income','Transfer'].forEach(x=>document.getElementById('t'+x).classList.remove('on'));document.getElementById('t'+t[0].toUpperCase()+t.slice(1)).classList.add('on');document.getElementById('normalFields').style.display=t==='transfer'?'none':'block';document.getElementById('transferFields').style.display=t==='transfer'?'block':'none'}
function saveEntry(){
 const amount=Number(document.getElementById('amount').value),date=document.getElementById('date').value;
 if(!amount||amount<=0)return alert('請輸入金額');
 if(entryType==='transfer'){
   const from=document.getElementById('fromWallet').value,to=document.getElementById('toWallet').value;
   if(from===to)return alert('轉出與轉入不能是同一個錢包');
   if(w(from).balance<amount&&!confirm('這會讓轉出錢包變成負數，仍要繼續嗎？'))return;
   w(from).balance-=amount;w(to).balance+=amount;
   data.records.push({type:'transfer',amount,date,memo:`${w(from).name} → ${w(to).name}`});
 }else{
   const wallet=document.getElementById('wallet').value,memo=document.getElementById('memo').value.trim();
   const reserveItem=wallet==='reserve'?document.getElementById('reserveItem').value:'';
   if(wallet==='reserve'&&!reserveItem)return alert('家庭固存只能從指定品項扣款，請先選固存項目');
   if(entryType==='expense')w(wallet).balance-=amount;else w(wallet).balance+=amount;
   if(entryType==='expense')data.bankActual-=amount;else data.bankActual+=amount;
   data.records.push({type:entryType,amount,date,wallet,reserveItem,memo:memo||reserveItem||'記帳'});
 }
 document.getElementById('amount').value='';document.getElementById('memo').value='';closeEntry();persist();
}
function saveActual(){data.bankActual=Number(document.getElementById('bankActual').value)||0;persist();alert('已更新，首頁會顯示帳目是否相符')}
function backup(){
 const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='宣的專款帳本備份-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)
}
function restore(e){
 const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);persist();alert('備份已還原')}catch{alert('備份檔格式不正確')}};r.readAsText(f)
}
function resetAll(){if(confirm('確定要清除目前資料並回到第一版起始資料嗎？')){data=clone(seed);persist()}}
render();
</script>
</body>
</html>
